name: shopsteward
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: shopsteward
      POSTGRES_USER: shopsteward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsteward -d shopsteward"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
