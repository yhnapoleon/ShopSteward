[project]
name = "shopsteward-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "shopsteward-knowledge",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
agent = ["shopsteward-agent"]

[tool.uv.sources]
shopsteward-knowledge = { workspace = true }
shopsteward-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "jsonschema==4.23.0",
    "openapi-spec-validator==0.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../simulation"]
asyncio_mode = "auto"
markers = ["integration: requires a migrated dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
package = false
