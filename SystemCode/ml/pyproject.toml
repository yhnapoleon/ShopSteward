[project]
name = "shopsteward-ml"
version = "6.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.8,<3",
    "lightgbm>=4.6,<5",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
runtime = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyarrow>=19,<22", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsteward_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
package = true
