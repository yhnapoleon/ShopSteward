="#68d9e5" stroke-opacity=".4" /><rect x="18" y="18" width="29" height="29" rx="6" fill="#68d9e5" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#68d9e5">C</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Business backend</text><text x="20" y="74" font-size="13" fill="#68d9e5">Business rules · planning &amp; execution</text><line x1="20" y1="92" x2="460" y2="92" stroke="#68d9e5" stroke-opacity=".15"/><text x="20" y="117" class="mono" font-size="9.5" letter-spacing="1" fill="#728fa5">RESPONSIBILITY</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,0)">Calculate inventory, cash and purchase options</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,24)">Manage Mission → Plan → approval → Action</text><text x="20" y="211" font-size="11.5" fill="#8ca7bc">Business worker · durable jobs · event tracking</text></g><g class="module" data-id="D" role="button" tabindex="0" aria-label="D: Knowledge &amp; retrieval, IMPLEMENTED, view details" transform="translate(30,470)"><rect class="outline" width="360" height="230" rx="12" fill="#102330" stroke="#68d9e5" stroke-opacity=".4" /><rect x="18" y="18" width="29" height="29" rx="6" fill="#68d9e5" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#68d9e5">D</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Knowledge &amp; retrieval</text><text x="20" y="74" font-size="13" fill="#68d9e5">RAG · policy &amp; supplier-term retrieval</text><line x1="20" y1="92" x2="340" y2="92" stroke="#68d9e5" stroke-opacity=".15"/><text x="20" y="117" class="mono" font-size="9.5" letter-spacing="1" fill="#728fa5">RESPONSIBILITY</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,0)">Parse and index supplier documents</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,24)">Retrieve versioned evidence for citations</text><text x="20" y="185" font-size="10.5" fill="#68d9e5">Source: quotation files + retrieval documents</text><text x="20" y="206" font-size="11.5" fill="#8ca7bc">Knowledge API / worker + delivery publisher</text></g><g class="module" data-id="E" role="button" tabindex="0" aria-label="E: Demand forecasting, IMPLEMENTED, view details" transform="translate(470,470)"><rect class="outline" width="360" height="230" rx="12" fill="#102330" stroke="#68d9e5" stroke-opacity=".4" /><rect x="18" y="18" width="29" height="29" rx="6" fill="#68d9e5" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#68d9e5">E</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Demand forecasting</text><text x="20" y="74" font-size="13" fill="#68d9e5">LightGBM + neural-network ensemble</text><line x1="20" y1="92" x2="340" y2="92" stroke="#68d9e5" stroke-opacity=".15"/><text x="20" y="117" class="mono" font-size="9.5" letter-spacing="1" fill="#728fa5">RESPONSIBILITY</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,0)">Estimate demand from sales history</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,24)">Provide forecast evidence to the planner</text><text x="20" y="185" font-size="10.5" fill="#68d9e5">Source: public M5 sales histories</text><text x="20" y="206" font-size="11.5" fill="#8ca7bc">Independent ML HTTP API · frozen model bundle</text></g><g class="module" data-id="F" role="button" tabindex="0" aria-label="F: Business simulation, IMPLEMENTED, view details" transform="translate(910,470)"><rect class="outline" width="480" height="230" rx="12" fill="#102330" stroke="#68d9e5" stroke-opacity=".4" /><rect x="18" y="18" width="29" height="29" rx="6" fill="#68d9e5" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#68d9e5">F</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Business simulation</text><text x="20" y="74" font-size="13" fill="#68d9e5">Scenario-driven business simulation</text><line x1="20" y1="92" x2="460" y2="92" stroke="#68d9e5" stroke-opacity=".15"/><text x="20" y="117" class="mono" font-size="9.5" letter-spacing="1" fill="#728fa5">RESPONSIBILITY</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,0)">Generate sales, delivery and settlement events</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,24)">Return purchase receipts for repeatable scenarios</text><text x="20" y="185" font-size="10.5" fill="#68d9e5">Source: authored business scenarios</text><text x="20" y="206" font-size="11.5" fill="#8ca7bc">SC01 / SANDBOX · independent simulation state</text></g><g class="module" data-id="G" role="button" tabindex="0" aria-label="G: Task evaluation, EXPERIMENTAL, view details" transform="translate(30,830)"><rect class="outline" width="360" height="245" rx="12" fill="#29221c" stroke="#efbd74" stroke-opacity=".4" /><rect x="18" y="18" width="29" height="29" rx="6" fill="#efbd74" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#efbd74">G</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Task evaluation</text><text x="20" y="74" font-size="13" fill="#efbd74">Task outcomes · tool-use evaluation</text><line x1="20" y1="92" x2="340" y2="92" stroke="#efbd74" stroke-opacity=".15"/><text x="20" y="117" class="mono" font-size="9.5" letter-spacing="1" fill="#728fa5">RESPONSIBILITY</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,0)">Validate task cases and score decisions</text><text x="20" y="141" font-size="13" fill="#bfcedd" transform="translate(0,24)">Check actual tool execution and model usage</text><text x="20" y="221" font-size="11.5" fill="#8ca7bc">Independent posttraining evaluation harness</text></g><g class="module" data-id="H" role="button" tabindex="0" aria-label="H: Learning &amp; orchestration extensions, PROPOSED, view details" transform="translate(470,830)"><rect class="outline" width="920" height="245" rx="12" fill="#211e35" stroke="#b9a4fa" stroke-opacity=".4" stroke-dasharray="6 5"/><rect x="18" y="18" width="29" height="29" rx="6" fill="#b9a4fa" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#b9a4fa">H</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Learning &amp; orchestration extensions</text><text x="20" y="74" font-size="13" fill="#b9a4fa">Candidate technologies · not implemented</text><line x1="20" y1="92" x2="900" y2="92" stroke="#b9a4fa" stroke-opacity=".15"/><text x="20" y="124" font-size="15" font-weight="550" fill="#e5dff5">Task SFT &amp; serving</text><text x="20" y="153" font-size="12.5" fill="#b9a4fa">Qwen3-8B · LoRA · vLLM</text><text x="20" y="181" font-size="11.5" fill="#a99cbd">Verified examples → task model</text><line x1="307" x2="307" y1="110" y2="204" stroke="#b9a4fa" stroke-opacity=".16"/><text x="320" y="124" font-size="15" font-weight="550" fill="#e5dff5">Multi-agent coordination</text><text x="320" y="153" font-size="12.5" fill="#b9a4fa">LangGraph supervisor + subgraphs</text><text x="320" y="181" font-size="11.5" fill="#a99cbd">Delegate → share state → synthesize</text><line x1="607" x2="607" y1="110" y2="204" stroke="#b9a4fa" stroke-opacity=".16"/><text x="620" y="124" font-size="15" font-weight="550" fill="#e5dff5">Reinforcement learning</text><text x="620" y="153" font-size="12.5" fill="#b9a4fa">Simulator rollouts · GRPO/PPO*</text><text x="620" y="181" font-size="11.5" fill="#a99cbd">Feedback → reward → policy update</text><text x="20" y="225" font-size="10.5" fill="#8f82a5">Candidate technologies. *RL algorithms require selection and validation; these components are not implemented.</text></g><text x="30" y="1104" fill="#627e99" font-size="10">Logical modules / current application + independent evaluation + proposed research extensions</text><rect y="1120" width="1440" height="70" fill="#0b121c"/><text x="30" y="1147" font-size="16" fill="#a5bbd0">ShopSteward / Core technologies and technical modules</text><text x="30" y="1170" font-size="12" fill="#a5bbd0">Cyan: implemented | Amber: experimental | Violet / dashed: proposed</text></svg>