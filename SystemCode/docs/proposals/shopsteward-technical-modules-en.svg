<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1440" height="1190" viewBox="0 0 1440 1190" role="group" aria-label="ShopSteward technical modules"><title>ShopSteward / Technical modules, technologies and responsibilities</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#7494b7" opacity=".12"/></pattern><marker id="arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#68d9e5" stroke-width="1.5"/></marker><marker id="arrow-experiment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#efbd74" stroke-width="1.5"/></marker><marker id="arrow-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b9a4fa" stroke-width="1.5"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace}.module{cursor:pointer;transition:opacity .2s}.module:hover .outline,.module:focus .outline{stroke-opacity:1;stroke-width:2}.module:focus{outline:none}.edge-label{paint-order:stroke;stroke:#0e1725;stroke-width:5;stroke-linejoin:round}</style><rect width="1440" height="1120" fill="#0e1725"/><rect width="1440" height="1120" fill="url(#dots)"/><text x="28" y="30" class="mono" font-size="12" letter-spacing="1.3" fill="#8ec3ce">01 / APPLICATION &amp; AGENT CONTROL</text><text x="28" y="397" class="mono" font-size="12" letter-spacing="1.3" fill="#8ec3ce">02 / KNOWLEDGE, FORECASTING &amp; SIMULATION</text><text x="28" y="773" class="mono" font-size="12" letter-spacing="1.3" fill="#b5a1df">03 / EVALUATION &amp; PROPOSED EXTENSIONS</text><path d="M210 120V75H1150V120" fill="none" stroke="#68d9e5" stroke-opacity=".55" stroke-width="1.7" marker-start="url(#arrow-current)" marker-end="url(#arrow-current)"/><text x="690" y="64" text-anchor="middle" class="edge-label" font-size="12" fill="#8db8c8">User requests, approvals and results / Nitro → business API</text><path d="M830 245H910" fill="none" stroke="#68d9e5" stroke-opacity=".65" stroke-width="1.7" marker-start="url(#arrow-current)" marker-end="url(#arrow-current)"/><text x="870" y="222" text-anchor="middle" class="edge-label" font-size="10" fill="#8db8c8">Tool HTTP</text><path d="M1150 355V428H210V470M650 428V470M1150 428V470" fill="none" stroke="#68d9e5" stroke-opacity=".45" stroke-width="1.7"/><path d="M210 449V470M650 449V470M1150 449V470" stroke="#68d9e5" stroke-opacity=".55" marker-end="url(#arrow-current)"/><text x="830" y="418" text-anchor="middle" class="edge-label" font-size="12" fill="#8db8c8">Backend integrations / forecast, retrieval and operating events</text><path d="M930 830V725H1150V700" fill="none" stroke="#b9a4fa" stroke-opacity=".52" stroke-dasharray="5 5" stroke-width="1.6" marker-start="url(#arrow-future)" marker-end="url(#arrow-future)"/><text x="1130" y="749" text-anchor="middle" class="edge-label" font-size="11" fill="#a79acd">Proposed rollout adapter / policy ↔ simulator</text><path d="M470 951H390" stroke="#b9a4fa" stroke-opacity=".6" stroke-dasharray="5 5" stroke-width="1.6" marker-end="url(#arrow-future)"/><text x="430" y="927" text-anchor="middle" class="edge-label" font-size="10" fill="#a79acd">Evaluate</text><g class="module" data-id="A" role="button" tabindex="0" aria-label="A: Frontend &amp; workspace, IMPLEMENTED, view details" transform="translate(30,120)"><rect class="outline" width="360" height="235" rx="12" fill="#102330" stroke="#68d9e5" stroke-opacity=".4" /><rect x="18" y="18" width="29" height="29" rx="6" fill="#68d9e5" fill-opacity=".12"/><text x="32.5" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#68d9e5">A</text><text x="59" y="38" font-size="20" font-weight="550" fill="#e5effa">Frontend &amp; workspace</text><text x="20" y="74" font-